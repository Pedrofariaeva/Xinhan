<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account · Xinhan Chinese Language School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --jade-900: #0f291e; --jade-800: #1b4332; --jade-700: #2d6a4f;
      --jade-600: #40916c; --jade-500: #52b788; --jade-100: #d8f3dc; --jade-50: #f1f8f4;
      --gold-500: #d4a574; --gold-400: #e8c39e; --paper: #fdfcfa;
      --ink: #1a1a1a; --ink-light: #4a4a4a; --ink-muted: #8a8a8a;
      --radius: 12px; --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--jade-800) 0%, var(--jade-900) 100%);
      padding: 24px;
    }
    .auth-card {
      background: #fff; border-radius: 20px; width: 100%; max-width: 420px;
      box-shadow: var(--shadow-lg); overflow: hidden;
    }
    .auth-card-inner { padding: 40px 36px 36px; }
    .auth-header { text-align: center; margin-bottom: 28px; }
    .logo-mark {
      width: 48px; height: 48px; background: var(--jade-800); border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--gold-400); font-family: 'Noto Serif SC', serif;
      font-size: 22px; font-weight: 700; margin-bottom: 16px;
    }
    .auth-header h1 {
      font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700;
      color: var(--jade-800); margin-bottom: 4px;
    }
    .auth-header p { font-size: 14px; color: var(--ink-muted); }
    .alert {
      display: none; align-items: center; gap: 10px;
      background: #ffebee; color: #c62828; font-size: 13px; font-weight: 500;
      padding: 12px 14px; border-radius: 10px; margin-bottom: 20px;
      border: 1px solid #ef9a9a;
    }
    .alert.show { display: flex; }
    .alert svg { flex-shrink: 0; width: 18px; height: 18px; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--ink-light); margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%; padding: 14px 16px; font-size: 15px;
      font-family: 'Inter', sans-serif; color: var(--ink);
      background: #fafafa; border: 1.5px solid #e8e8e8;
      border-radius: 10px; outline: none; transition: all 0.2s;
      appearance: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--jade-500); background: #fff;
      box-shadow: 0 0 0 3px rgba(82,183,136,0.12);
    }
    .select-wrapper { position: relative; }
    .select-wrapper::after {
      content: ''; position: absolute; right: 16px; top: 50%;
      transform: translateY(-50%);
      border-left: 5px solid transparent; border-right: 5px solid transparent;
      border-top: 5px solid var(--ink-muted); pointer-events: none;
    }
    .btn-submit {
      width: 100%; padding: 16px; font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 600; color: #fff;
      background: var(--jade-800); border: none; border-radius: 10px;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-top: 8px;
    }
    .btn-submit:hover:not(:disabled) { background: var(--jade-700); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner {
      width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .auth-footer {
      text-align: center; margin-top: 24px;
      font-size: 14px; color: var(--ink-muted);
    }
    .auth-footer a { color: var(--jade-700); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
    .back-link {
      position: absolute; top: 24px; left: 24px;
      display: inline-flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,0.7); text-decoration: none;
      font-size: 14px; font-weight: 500; transition: color 0.2s;
    }
    .back-link:hover { color: #fff; }
    .hint { font-size: 12px; color: var(--ink-muted); margin-top: 6px; }
  </style>
</head>
<body>
  <a href="/" class="back-link">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to home
  </a>
  <div class="auth-card">
    <div class="auth-card-inner">
      <div class="auth-header">
        <div class="logo-mark">新</div>
        <h1>Create your account</h1>
        <p>Start learning Mandarin with Xinhan</p>
      </div>
      <div class="alert" id="errorAlert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <span id="errorText">Something went wrong</span>
      </div>
      <form id="signupForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="role">I am a</label>
          <div class="select-wrapper">
            <select id="role" name="role" required>
              <option value="student" selected>Student</option>
              <option value="teacher">Teacher</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters" required autocomplete="new-password">
          <div class="hint">Must be at least 6 characters</div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">
          <span id="btnText">Create Account</span>
        </button>
      </form>
      <div class="auth-footer">
        Already have an account? <a href="/signin.html">Sign in</a>
      </div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
  <script>
    const form = document.getElementById('signupForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const errorAlert = document.getElementById('errorAlert');
    const errorText = document.getElementById('errorText');

    function showError(msg) { errorText.textContent = msg; errorAlert.classList.add('show'); }
    function hideError() { errorAlert.classList.remove('show'); }
    function setLoading(loading) {
      submitBtn.disabled = loading;
      btnText.innerHTML = loading ? '<div class="spinner"></div>' : 'Create Account';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const role = document.getElementById('role').value;

      if (!name || !email || !password) { showError('Please fill in all fields.'); return; }
      if (password !== confirmPassword) { showError('Passwords do not match.'); return; }
      if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }

      setLoading(true);
      const result = await register(name, email, password, role);
      if (result.ok) {
        window.location.href = '/dashboard.html';
      } else {
        showError(result.error || 'Registration failed. Please try again.');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
